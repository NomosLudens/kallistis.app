              inf.opcoes.forEach((x) =>
                rr.appendChild(
                  el(
                    "button",
                    {
                      class: "chip",
                      style: "cursor:pointer",
                      onclick: () => {
                        tr.pericaEscolhida = x;
                        save();
                        render();
                      },
                    },
                    x,
                  ),
                ),
              );
              card.appendChild(rr);
            }
            if (!tr.chave) {
              const rr = el("div", { class: "row", style: "margin-top:8px" });
              o.chaves.forEach((x) =>
                rr.appendChild(
                  el(
                    "button",
                    {
                      class: "chip",
                      style: "cursor:pointer",
                      onclick: () => {
                        tr.chave = x;
                        save();
                        render();
                      },
                    },
                    x,
                  ),
                ),
              );
              card.appendChild(rr);
            }
          }
          tt.appendChild(card);
        });
        const of2 = el("div", { class: "row", style: "margin-top:10px" }),
          sel = el("select", { id: "novoOficio", style: "max-width:280px" });
        sel.appendChild(el("option", { value: "" }, "— novo Ofício —"));
        CANON.oficios
          .filter((o) => !c.trilhas.some((x) => x.oficio === o.nome))
          .forEach((o) => sel.appendChild(el("option", { value: o.nome }, o.nome)));
        of2.appendChild(sel);
        of2.appendChild(
          el(
            "button",
            {
              class: "btn",
              disabled: !DB.mestre,
              onclick: () => {
                const v = sel.value;
                if (!v) return;
                const causa = prompt(
                  "Registre a causa narrativa reconhecida para aprender " + v + ":",
                  "",
                );
                if (causa === null || !causa.trim()) return;
                criarCheckpoint(c, "Antes de aprender novo Ofício");
                const nt = novaTrilha(v);
                c.trilhas.push(nt);
                c.trilhaAtiva = c.trilhas.length - 1;
                registrarHistorico(c, "Novo Ofício", v + " aprendido — " + causa.trim());
                save();
                render();
              },
            },
            "Registrar novo Ofício no Marco 1",
          ),
        );
        tt.appendChild(of2);
        tt.appendChild(
          el(
            "p",
            { class: "small dim", style: "margin-top:8px" },
            "Exige evento, origem reconhecível do aprendizado, responsabilidade assumida e confirmação do Mestre. A nova Trilha começa no Marco 1 e não recebe progressão retroativa.",
          ),
        );
        wrap.appendChild(tt);
        return wrap;
      }
      function descreveGanho(g) {
        return typeof g === "string" ? g : g.valor || g.tipo;
      }
      function reverterMarco(c, t, marco) {
        return false;
      }
      function resolvedorGanho(c, t, g) {
        const of = byName(CANON.oficios, t.oficio);
        const card = el("div", { class: "card", style: "margin-bottom:10px" });
        card.appendChild(el("h4", null, "Marco " + g.marco + " · " + g.rotulo));
        const set = (valor, tipo) => {
          t.ganhos[g.id] = { tipo: tipo || g.tipo, valor };
          registrarHistorico(c, "Marco " + g.marco, g.rotulo + ": " + String(valor));
          save();
          render();
        };

        const listaTecnicas = (niveisMax) => {
          const disp = tecnicasDisponiveis(t, niveisMax);
          if (!disp.length)
            return el(
              "p",
              { class: "dim small" },
              "Nenhuma Técnica desta Trilha está disponível neste Marco.",
            );
          const sel = el("select");
          sel.appendChild(el("option", { value: "" }, "— escolher Técnica —"));
          disp.forEach((x) =>
            sel.appendChild(
              el("option", { value: x.nome }, x.nome + " · Nível " + x.nivel + " · " + x.custo),
            ),
          );
          return el(
            "div",
            { class: "row" },
            sel,
            el(
              "button",
              {
                class: "btn",
                onclick: () => {
                  if (!sel.value) return;
                  t.tecnicas.push(sel.value);
                  set(sel.value, "tecnica");
                },
              },
              "Registrar",
            ),
          );
        };
        const listaMagias = (requiredGrade = null) => {
          const grauMax = grauMagiaMax(t.marco, t.oficio),
            gradeFilter = requiredGrade === null ? null : requiredGrade;
          const acesso =
            t.oficio === "Tecelão" || (t.knownForms || []).length > 0 || t.acessoMagia === true;
          if (!acesso) {
            return el(
              "div",
              null,
              el(
                "p",
                { class: "small muted" },
                "Esta Trilha não possui acesso ao catálogo de magias. Possuir Sintonia não concede magias: o acesso vem de Técnica, mestre, tradição, ordem, estudo, Dom, presente, bênção, pacto, artefato ou acontecimento narrativo equivalente.",
              ),
              el(
                "button",
                {
                  class: "btn ghost",
                  disabled: !DB.mestre,
                  onclick: () => {
                    t.acessoMagia = true;
                    save();
                    render();
                  },
                },
                DB.mestre ? "Registrar acesso concedido na ficção" : "Acesso exige Modo Mestre",
              ),
            );
          }
          const disp = MAGIC_FORMS.filter(
            (m) => !(t.knownForms || []).some((x) => x.formId === m.id),
          );
          const gradeCap = MAGIC_GRADE_CAP(t.marco);
          const sel = el("select");
          sel.appendChild(el("option", { value: "" }, "— escolher Forma —"));
          disp.forEach((m) =>
            sel.appendChild(
              el(
                "option",
                { value: m.id },
                m.canonicalName + " · até G" + gradeCap,
              ),
            ),
          );
          const selGrau = el("select");
          selGrau.setAttribute("aria-label", "Grau máximo da Forma");
          for (let grau = 0; grau <= gradeCap; grau++)
            selGrau.appendChild(el("option", { value: String(grau) }, "máximo G" + grau));
          selGrau.value = String(requiredGrade ?? gradeCap);
          if (requiredGrade !== null) selGrau.disabled = true;
          return el(
            "div",
            null,
            el(
              "div",
              { class: "row" },
              sel,
              selGrau,
              el(
                "button",
                {
                  class: "btn",
                  onclick: () => {
                    if (!sel.value) return;
                    t.knownForms = t.knownForms || [];
                    t.knownForms.push({ formId: sel.value, maxGrade: Number(selGrau.value) });
                    set(sel.value, "forma");
                  },
                },
                "Registrar Forma",
              ),
            ),
            el(
              "p",
              { class: "small dim", style: "margin-top:6px" },
              requiredGrade === null
                ? "Aprender exige fonte real, tempo ou acontecimento compatível. Qualquer Ofício pode adquirir; Sintonia limita a quantidade. Escolha o grau máximo de 0 até " +
                    gradeCap +
                    "."
                : "Esta vaga exige uma Forma conhecida com Grau máximo " + requiredGrade + ".",
            ),
          );
        };

        const listaPericias = () => {
          const sel = el("select");
          sel.appendChild(el("option", { value: "" }, "— escolher Perícia —"));
          const P = pericias(c);
          SKILLS.forEach((s) => {
            if (P[s] >= 5) return;
            sel.appendChild(el("option", { value: s }, s + " · atual " + P[s]));
          });
          return el(
            "div",
            { class: "row" },
            sel,
            el(
              "button",
              {
                class: "btn",
                onclick: () => {
                  if (!sel.value) return;
                  set(sel.value, "pericia");
                },
              },
              "Registrar",
            ),
          );
        };

        switch (g.tipo) {
          case "tecnica":
            card.appendChild(listaTecnicas(t.marco));
            break;
          case "magia":
            card.appendChild(listaMagias());
            break;
          case "forma_tecelao":
            card.appendChild(listaMagias());
            break;
          case "pericia":
            card.appendChild(listaPericias());
            break;
          case "tecnica_ou_magia":
            card.appendChild(
              el(
                "p",
                { class: "small dim" },
                "Escolha uma Técnica da Trilha ou uma magia, quando houver acesso válido.",
              ),
            );
            card.appendChild(listaTecnicas(t.marco));
            card.appendChild(el("div", { style: "height:8px" }));
            card.appendChild(listaMagias());
            break;
          case "tecnica_avancada":
            card.appendChild(
              el(
                "p",
                { class: "small dim" },
                "Técnica de Nível II ou III disponível ao Marco, ou Evocação Maior pela Técnica de Evocador.",
              ),
            );
            card.appendChild(listaTecnicas(t.marco));
            break;
          case "especializacao": {
            const sel = el("select");
            sel.appendChild(el("option", { value: "" }, "— escolher Especialização —"));
            of.especializacoes
              .filter((e) => !t.especializacoes.includes(e.nome))
              .forEach((e) => sel.appendChild(el("option", { value: e.nome }, e.nome)));
            card.appendChild(
              el(
                "div",
                { class: "row" },
                sel,
                el(
                  "button",
                  {
                    class: "btn",
                    onclick: () => {
                      if (!sel.value) return;
                      t.especializacoes.push(sel.value);
                      set(sel.value, "especializacao");
                    },
                  },
                  "Registrar",
                ),
              ),
            );
            break;
          }
          case "manifestacao_epica": {
            const nome = el("input", { type: "text", placeholder: "Nome da Manifestação Épica" });
            const conceito = el("textarea", { placeholder: "Conceito" });
            const descricao = el("textarea", {
              placeholder: "Descrição narrativa da manifestação",
            });
            const visual = el("textarea", { placeholder: "Manifestação visual ou ficcional" });
            const ativacao = el("input", { placeholder: "Ativação" });
            const efeito = el("textarea", { placeholder: "Efeito permitido na ficção" });
            const custo = el("input", { type: "text", placeholder: "Custo ou preço" });
            const duracao = el("input", { type: "text", placeholder: "Duração" });
            const alvos = el("input", { type: "text", placeholder: "Alvos ou objeto" });
            const limitacoes = el("textarea", { placeholder: "Limitações e fronteiras" });
            const riscos = el("textarea", { placeholder: "Consequências ou riscos" });
            card.appendChild(
              el(
                "p",
                { class: "small muted" },
                "Proposta criada pelo jogador. O Mestre precisa aprová-la antes da aplicação do Marco; ela não cria ação, recurso ou poder automático.",
              ),
            );
            card.appendChild(
              el(
                "div",
                { style: "display:grid;gap:8px;margin-top:8px" },
                nome,
                conceito,
                descricao,
                visual,
                ativacao,
                efeito,
                custo,
                duracao,
                alvos,
                limitacoes,
                riscos,
              ),
            );
            card.appendChild(
              el(
                "button",
                {
                  class: "btn",
                  onclick: () => {
                    if (
                      !nome.value.trim() ||
                      !conceito.value.trim() ||
                      !descricao.value.trim() ||
                      !visual.value.trim() ||
                      !ativacao.value.trim() ||
                      !efeito.value.trim() ||
                      !custo.value.trim() ||
                      !duracao.value.trim() ||
                      !alvos.value.trim() ||
                      !limitacoes.value.trim() ||
                      !riscos.value.trim()
                    )
                      return;
                    const item = {
                      nome: nome.value.trim(),
                      conceito: conceito.value.trim(),
                      descricao: descricao.value.trim(),
                      manifestacao_visual_ou_ficcional: visual.value.trim(),
                      ativacao: ativacao.value.trim(),
                      efeito: efeito.value.trim(),
                      custo: custo.value.trim(),
                      duracao: duracao.value.trim(),
                      alvos_ou_objeto: alvos.value.trim(),
                      limitacoes: limitacoes.value.trim(),
                      consequencias_ou_riscos: riscos.value.trim(),
                      horizonte:
                        g.marco === 11
                          ? "CENA"
                          : g.marco === 12
                            ? "BAIRRO"
                            : g.marco === 13
                              ? "CIDADE"
                              : g.marco === 14
                                ? "POVO"
                                : "MUNDO",
                      tipo: "normal",
                      grauMagiaEpica: null,
                      statusHomologacao: "RASCUNHO",
                      mechanicallyActive: false,
                      reviewRequired: false,
                      masterFeedback: "",
                      marco: g.marco,
                      oficio: t.oficio,
                      aprovadaPeloMestre: false,
                    };
                    t.manifestacoesEpicas.push(item);
                    set(item.nome, "manifestacao_epica");
                  },
                },
                "Registrar proposta",
              ),
            );
            break;
          }
          case "magia_epica":
            card.appendChild(
              el(
                "p",
                { class: "small muted" },
                "Magia Épica " +
                  g.tier +
                  " (" +
                  (g.tier === "I" ? "G4" : g.tier === "II" ? "G5" : "G6") +
                  ") desbloqueada. A manifestação parte de uma Forma conhecida, exige homologação do Mestre e não cria recurso ou ação extra.",
              ),
            );
            card.appendChild(
              el(
                "button",
                {
                  class: "btn",
                  onclick: () => {
                    t.magiaEpica = g.tier;
                    set(g.tier, "magia_epica");
                  },
                },
                "Registrar desbloqueio",
              ),
            );
            break;
          case "atributo": {
            const A = atributos(c);
            const sel = el("select");
            sel.appendChild(el("option", { value: "" }, "— escolher Atributo —"));
            const cap = atributoMaximoMarco(g.marco);
            ATTRS.forEach((a) => {
              if (A[a] >= cap) return;
              sel.appendChild(el("option", { value: a }, a + " · " + A[a] + " → " + (A[a] + 1)));
            });

                  {
                    class: "btn",
                    onclick: () => {
                      if (!sel.value) return;

                    },
                  },

                ),
              ),
            );
            card.appendChild(
              el(
                "p",
                { class: "small dim", style: "margin-top:6px" },
                "Máximo " + cap + " neste Marco.",

          }
          case "vinculo": {

              el(

                el(
                  "button",
                  {
                    class: "btn",
                    onclick: () => {

                      set(inp.value.trim(), "vinculo");
                    },
                  },
                  "Registrar",
                ),

          case "marco9": {

            const selT = el("select");

              .filter((o) => o.nome !== t.oficio)

                el(

                  {
                    class: "btn",
                    onclick: () => {

                      set(selE.value, "especializacao");
                    },
                  },
                  "Registrar",
                ),
              ),
            );
            card.appendChild(el("div", { style: "height:8px" }));
            card.appendChild(
              el(
                "div",
                { class: "row" },
                selT,
                el(
                  "button",
                  {

                    onclick: () => {

              ),
            );
            break;
          }
          case "legado": {
            const opts = [
              "tornar-se referência de um Ofício",
              "fundar ordem ou comunidade",
              "restaurar artefato maior",
              "estabelecer nova relação entre mundos",
              "dominar forma única de magia",

            sel.appendChild(el("option", { value: "" }, "— escolher Legado —"));

      function tabela(cols, rows) {
        const t = el("table");
        t.appendChild(el("thead", null, el("tr", null, ...cols.map((c) => el("th", null, c)))));
        const b = el("tbody");
        rows.forEach((r) =>
          b.appendChild(

          ),
        );
        t.appendChild(b);
        return t;
      }

      /* ---------- modo mestre ---------- */
      function alternarMestre() {
        if (!TAL_EDIT_MODE) return;
        if (DB.mestre) {
          DB.mestre = false;
          save();
          render();
          return;
        }
        if (DB.mestrePinHash) {
          const pin = prompt("PIN local do Mestre:", "");
          if (pin === null) return;
          if (pinHash(pin) !== DB.mestrePinHash) {
            alert("PIN incorreto.");
            return;
          }
        }
        DB.mestre = true;
        save();
        render();
      }
      function configurarPinMestre() {
        if (!TAL_EDIT_MODE) return;
        if (!DB.mestre) return;
        const pin = prompt(
          "Defina um PIN local para a trava de fluxo do Mestre. Ele não é segurança criptográfica:",
          "",
        );
        if (pin === null) return;
        if (!pin) {
          DB.mestrePinHash = "";
          save();
          render();
          return;
        }
        if (pin.length < 4) {
          alert("Use pelo menos 4 caracteres.");
          return;
        }
        DB.mestrePinHash = pinHash(pin);
        save();
        render();
      }
      function viewMestre() {
        if (!TAL_EDIT_MODE)
          return el(
            "div",
            { class: "panel" },
            el("p", { class: "muted" }, "Modo Mestre indisponível nesta superfície."),
          );
        const wrap = el("div"),
          p = el("div", { class: "panel" });
        p.appendChild(el("div", { class: "kicker" }, "Modo Mestre"));
        p.appendChild(
          el("h1", null, DB.mestre ? "Controles de mesa ativos" : "Controles de mesa bloqueados"),
        );
        p.appendChild(
          el(
            "p",
            { class: "muted", style: "max-width:70ch" },
            "O Modo Mestre autoriza acontecimentos que dependem da campanha. Ativá-lo não concede automaticamente um Marco: a autorização do próximo Marco é registrada separadamente na Trilha. O PIN, quando usado, é apenas uma trava local de fluxo; um HTML local pode ser inspecionado e alterado.",
          ),
        );
        p.appendChild(
          el(
            "div",
            { class: "row", style: "margin-top:16px" },
            el(
              "button",
              { class: "btn " + (DB.mestre ? "" : "primary"), onclick: alternarMestre },

            ),
            DB.mestre
              ? el(
                  "button",
                  { class: "btn ghost", onclick: configurarPinMestre },
                  DB.mestrePinHash ? "Alterar/remover PIN" : "Definir PIN local",
                )
              : null,
          ),
        );
        wrap.appendChild(p);

        const c = atual(),
          t = trilha(c);
        if (c && t) {
          const m = el("div", { class: "panel" });
          m.appendChild(el("div", { class: "kicker" }, "Personagem ativa"));
          m.appendChild(el("h2", null, c.nome || "Sem nome"));
          m.appendChild(
            el(
              "p",
              { class: "muted small" },
              t.oficio + " · Marco " + t.marco + " · " + (t.papel || "papel não definido"),
            ),
          );
          const pend = ganhosPendentes(t),
            prox = t.marco + 1,
            authorized = t.advanceAuthorizedFor === prox;
          m.appendChild(el("div", { class: "sep" }));
          m.appendChild(el("div", { class: "kicker" }, "Avanço de Marco"));
          if (t.marco >= 15)
            m.appendChild(el("div", { class: "okbox" }, "Esta Trilha já alcançou o Marco 15."));

            m.appendChild(
              el(

              el(
                "div",
                { class: "note" },

              ),

            el(

              { class: "row", style: "margin-top:12px" },
              el(
                "button",
                {
                  class: "btn primary",
                  disabled: !DB.mestre || t.marco >= 15 || pend.length > 0 || authorized,
                  onclick: () => {
                    const note = prompt(
                      "Nota opcional para a autorização do Marco " + prox + ":",
                      "",

                    t.advanceAuthorizedFor = prox;

                    registrarHistorico(
                      c,

                        prox +
                        (t.advanceNote ? " — " + t.advanceNote : ""),

                "Habilitar próximo Marco",
              ),
              authorized
                ? el(
                    "button",
                    {
                      class: "btn danger",
                      disabled: !DB.mestre,
                      onclick: () => {
                        t.advanceAuthorizedFor = null;
                        t.advanceNote = "";
                        registrarHistorico(c, "Autorização", "Autorização de avanço cancelada");
                        save();
                        render();
                      },
                    },
                    "Cancelar autorização",
                  )
                : null,
            ),
          );

          m.appendChild(el("div", { class: "sep" }));
          m.appendChild(el("div", { class: "kicker" }, "Rollback estrutural"));
          m.appendChild(
            el(
              "p",
              { class: "small dim" },
              c.checkpoints.length
                ? c.checkpoints.length + " checkpoint(s) disponíveis."
                : "Nenhum checkpoint disponível.",
            ),
          );
          m.appendChild(
            el(
              "button",
              {
                class: "btn ghost",
                disabled: !DB.mestre || !c.checkpoints.length,
                onclick: () => {
                  if (
                    confirm(
                      "Restaurar o último checkpoint? A alteração estrutural mais recente será desfeita.",
                    )
                  ) {
                    restaurarUltimoCheckpoint(c);
                    render();
                  }
                },
              },
              "Restaurar último checkpoint",
            ),
          );

          m.appendChild(el("div", { class: "sep" }));
          m.appendChild(el("div", { class: "kicker" }, "Artefatos vinculados"));
          const asel = el("select", { style: "max-width:380px" });
          asel.appendChild(el("option", { value: "" }, "— Artefato canônico —"));
          CANON.artefatos.forEach((a) => asel.appendChild(el("option", { value: a.nome }, a.nome)));
          m.appendChild(
            el(
              "div",
              { class: "row" },
              asel,
              el(
                "button",
                {
                  class: "btn",
                  disabled: !DB.mestre,
                  onclick: () => {
                    if (!asel.value) return;
                    if (c.artefatosVinculados.some((a) => a.nome === asel.value)) {
                      alert("Artefato já vinculado.");
                      return;
                    }
                    const a = byName(CANON.artefatos, asel.value);
                    criarCheckpoint(c, "Antes de vincular Artefato");
                    c.artefatosVinculados.push({ ...a, vinculadoEm: new Date().toISOString() });
                    registrarHistorico(c, "Artefato", "Artefato vinculado: " + a.nome);
                    save();
                    render();
                  },
                },
                "Vincular",
              ),
            ),
          );
          if (c.artefatosVinculados.length) {
            c.artefatosVinculados.forEach((a, i) =>
              m.appendChild(
                el(
                  "div",
                  { class: "card", style: "margin-top:8px" },
                  el(
                    "div",
                    { class: "row", style: "justify-content:space-between" },
                    el("h4", null, a.nome),
                    el(
                      "button",
                      {
                        class: "btn danger",
                        disabled: !DB.mestre,
                        onclick: () => {
                          criarCheckpoint(c, "Antes de remover Artefato");
                          c.artefatosVinculados.splice(i, 1);
                          registrarHistorico(c, "Artefato", "Artefato desvinculado: " + a.nome);
                          save();
                          render();
                        },
                      },
                      "Remover",
                    ),
                  ),
                  el("p", null, "Promessa: " + a.promessa),
                  el("p", null, "Ativação: " + a.ativacao),
                ),
              ),
            );
          }
          wrap.appendChild(m);
        }

        const d = el("div", { class: "panel" });
        d.appendChild(el("div", { class: "kicker" }, "Dados e backup"));
        d.appendChild(
          el(
            "p",
            { class: "small muted" },
            "A sessão autenticada sincroniza com o servidor KALLISTIS; este navegador mantém apenas uma cópia de trabalho. Exporte JSON para transportar personagens entre dispositivos.",
          ),
        );
        d.appendChild(
          el(
            "div",
            { class: "row" },
            el(
              "button",
              {
                class: "btn ghost",
                onclick: () => {
                  const payload = {
                    schema: "kallistis.forge.backup.v2",
                    ruleset: RULESET,
                    exportadoEm: new Date().toISOString(),
                    db: DB,
                  };
                  const blob = new Blob([JSON.stringify(payload, null, 2)], {
                    type: "application/json",
                  });
                  const a = el("a", {
                    href: URL.createObjectURL(blob),
                    download: "kallistis_forge_backup.json",
                  });
                  document.body.appendChild(a);
                  a.click();
                  URL.revokeObjectURL(a.href);
                  a.remove();
                },
              },
              "Exportar tudo",
            ),
            el(
              "button",
              {
                class: "btn danger",
                disabled: !DB.mestre,
                onclick: () => {
                  if (confirm("Apagar todas as personagens deste navegador?")) {
                    DB = {
                      personagens: [],
                      atual: null,
                      mestre: DB.mestre,
                      mestrePinHash: DB.mestrePinHash,
                    };
                    save();
                    VIEW = "personagens";
                    render();
                  }
                },
              },
              "Apagar dados locais",
            ),
          ),
        );
        wrap.appendChild(d);
        return wrap;
      }

      render();
    </script>
