<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KALLISTIS — Character Forge</title>
    <style>
      :root {
        --bg: #08080a;
        --bg2: #0c0c0f;
        --panel: #101014;
        --panel2: #141419;
        --line: #22222a;
        --line2: #2e2e38;
        --ink: #efece6;
        --ink2: #b9b5ad;
        --ink3: #7d7a74;
        --accent: #e8e3d9;
        --danger: #c2564e;
        --ok: #8ea08a;
        --serif:
          "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
        --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background:
          radial-gradient(1200px 700px at 50% -10%, #131319 0%, rgba(0, 0, 0, 0) 62%),
          linear-gradient(180deg, #08080a 0%, #0a0a0d 100%);
        background-color: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        padding-bottom: env(safe-area-inset-bottom);
      }
      a {
        color: inherit;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      ::selection {
        background: #2d2d36;
      }
      nav[aria-label="Navegação JOGAR"] {
        top: 72px !important;
        pointer-events: none;
      }
      nav[aria-label="Navegação JOGAR"] a {
        pointer-events: auto;
      }
      @media (max-width: 860px) {
        nav[aria-label="Navegação JOGAR"] {
          top: 12px !important;
        }
      }
      @media (max-width: 640px) {
        .topin {
          padding-top: 48px;
        }
        nav[aria-label="Navegação JOGAR"] {
          top: 8px !important;
          right: 12px;
          left: 12px;
          justify-content: center;
          flex-wrap: nowrap;
          max-width: calc(100vw - 24px);
          overflow-x: auto;
          font-size: 10px;
        }
        nav[aria-label="Navegação JOGAR"] a {
          white-space: nowrap;
          padding-inline: 5px !important;
        }
      }

      header.top {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(8, 8, 10, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
        padding: 14px 20px calc(14px + env(safe-area-inset-top, 0px));
      }
      .topin {
        max-width: 1180px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .brand b {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 19px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .brand span {
        font-size: 11px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--ink3);
      }
      nav.tabs {
        display: flex;
        gap: 2px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      nav.tabs button {
        background: transparent;
        border: 1px solid transparent;
        color: var(--ink3);
        padding: 8px 13px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        min-height: 40px;
      }
      nav.tabs button:hover {
        color: var(--ink2);
      }
      nav.tabs button[aria-current="true"] {
        color: var(--ink);
        border-color: var(--line2);
        background: var(--panel);
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 34px 20px 90px;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--serif);
        font-weight: 600;
        margin: 0;
      }
      h1 {
        font-size: 30px;
        letter-spacing: 0.05em;
      }
      h2 {
        font-size: 20px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h3 {
        font-size: 16px;
        letter-spacing: 0.08em;
      }
      .kicker {
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--ink3);
        margin-bottom: 10px;
      }
      .muted {
        color: var(--ink2);
      }
      .dim {
        color: var(--ink3);
      }
      .small {
        font-size: 13px;
      }
      .tiny {
        font-size: 11.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink3);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 20px;
      }
      .panel + .panel {
        margin-top: 14px;
      }
      .grid {
        display: grid;
        gap: 14px;
      }
      .g2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .g3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .g4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .sep {
        height: 1px;
        background: var(--line);
        margin: 16px 0;
      }

      .btn {
        background: var(--panel2);
        border: 1px solid var(--line2);
        color: var(--ink);
        padding: 10px 16px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        min-height: 42px;
      }
      .btn:hover {
        border-color: #3d3d49;
        background: #181820;
      }
      .btn[disabled] {
        opacity: 0.38;
        cursor: not-allowed;
      }
      .btn.primary {
        background: var(--ink);
        color: #0a0a0c;
        border-color: var(--ink);
      }
      .btn.primary:hover {
        background: #fff;
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.danger {
        color: var(--danger);
        border-color: #3a2523;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        background: var(--bg2);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 11px 12px;
        font-size: 16px;
        outline: none;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: #3d3d49;
      }
      textarea {
        resize: vertical;
        min-height: 80px;
        line-height: 1.5;
      }
      label.f {
        display: block;
        margin-bottom: 14px;
      }
      label.f > span {
        display: block;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink3);
        margin-bottom: 6px;
      }

      .opt {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 14px;
        cursor: pointer;
        transition: border-color 0.12s;
      }
      .opt:hover {
        border-color: var(--line2);
      }
      .opt[aria-pressed="true"] {
        border-color: var(--ink);
        background: #17171d;
      }
      .opt b {
        display: block;
        font-family: var(--serif);
        font-size: 16px;
        letter-spacing: 0.04em;
        margin-bottom: 4px;
      }
      .opt p {
        margin: 0;
        font-size: 13px;
        color: var(--ink2);
        line-height: 1.45;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line2);
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink2);
        background: var(--panel2);
      }
      .chip.on {
        color: var(--ink);
        border-color: var(--ink);
      }
      .chip.warn {
        color: var(--danger);
        border-color: #432724;
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel2);
        padding: 14px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-family: var(--serif);
        font-size: 26px;
        line-height: 1.1;
      }
      .stat span {
        display: block;
        font-size: 10.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink3);
        margin-top: 6px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        font-size: 10.5px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink3);
        font-weight: 500;
      }

      .steps {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .steps button {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--ink3);
        padding: 7px 10px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        min-height: 38px;
      }
      .steps button.done {
        color: var(--ink2);
        border-color: var(--line2);
      }
      .steps button[aria-current="true"] {
        color: var(--ink);
        border-color: var(--ink);
        background: var(--panel);
      }

      .counter {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .counter button {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line2);
        background: var(--panel2);
        border-radius: 3px;
        cursor: pointer;
        font-size: 16px;
      }
      .counter b {
        min-width: 28px;
        text-align: center;
        font-family: var(--serif);
        font-size: 19px;
      }

      .bar {
        height: 6px;
        background: #17171d;
        border: 1px solid var(--line);
        border-radius: 2px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ink2);
      }

      .note {
        border-left: 2px solid var(--line2);
        padding: 8px 0 8px 14px;
        color: var(--ink2);
        font-size: 13.5px;
      }
      .alert {
        border: 1px solid #432724;
        background: #150f0f;
        color: #e2b7b2;
        border-radius: 3px;
        padding: 12px 14px;
        font-size: 13.5px;
      }
      .okbox {
        border: 1px solid #2a3329;
        background: #0e120e;
        color: #bcc9b8;
        border-radius: 3px;
        padding: 12px 14px;
        font-size: 13.5px;
      }

      details {
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel2);
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      details summary {
        cursor: pointer;
        font-family: var(--serif);
        font-size: 15px;
        letter-spacing: 0.04em;
        list-style: none;
      }
      details summary::-webkit-details-marker {
        display: none;
      }
      details summary::before {
        content: "+ ";
        color: var(--ink3);
      }
      details[open] summary::before {
        content: "– ";
        color: var(--ink3);
      }
      details .body {
        margin-top: 10px;
        font-size: 14px;
        color: var(--ink2);
      }

      .cardlist {
        display: grid;
        gap: 10px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--panel2);
        padding: 14px;
      }
      .card h4 {
        font-size: 15px;
        margin-bottom: 4px;
      }
      .card p {
        margin: 0;
        font-size: 13.5px;
        color: var(--ink2);
      }

      .profilegrid {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }
      .portrait {
        aspect-ratio: 3/4;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--bg2);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink3);
        text-align: center;
        padding: 12px;
      }
      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .galleryitem {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 3px;
        overflow: hidden;
      }
      .galleryitem img {
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        display: block;
        background: var(--bg2);
      }
      .galleryitem .cap {
        padding: 10px;
      }
      .filebtn input {
        display: none;
      }
      @media (max-width: 700px) {
        .profilegrid {
          grid-template-columns: 1fr;
        }
        .portrait {
          max-width: 260px;
        }
        .gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media print {
        header.top,
        footer,
        .btn,
        .filebtn,
        .steps {
          display: none !important;
        }
        body {
          background: #fff !important;
          color: #111 !important;
          font-size: 11pt;
        }
        main {
          max-width: none;
          padding: 0;
        }
        .panel,
        .card,
        .stat,
        details {
          background: #fff !important;
          color: #111 !important;
          border-color: #bbb !important;
          break-inside: avoid;
        }
        .muted,
        .dim,
        .tiny,
        .kicker,
        .small {
          color: #444 !important;
        }
        .portrait {
          background: #fff !important;
          border-color: #bbb !important;
        }
        textarea,
        input,
        select {
          border: 0 !important;
          background: #fff !important;
          color: #111 !important;
          padding: 0 !important;
        }
      }

      .profilegrid {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }
      .portrait {
        aspect-ratio: 3/4;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--bg2);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink3);
        text-align: center;
        padding: 12px;
      }
      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .galleryitem {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 3px;
        overflow: hidden;
      }
      .galleryitem img {
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        display: block;
        background: var(--bg2);
      }
      .galleryitem .cap {
        padding: 10px;
      }
      .filebtn input {
        display: none;
      }
      @media (max-width: 700px) {
        .profilegrid {
          grid-template-columns: 1fr;
        }
        .portrait {
          max-width: 260px;
        }
        .gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media print {
        header.top,
        footer,
        .btn,
        .filebtn,
        .steps {
          display: none !important;
        }
        body {
          background: #fff !important;
          color: #111 !important;
          font-size: 11pt;
        }
        main {
          max-width: none;
          padding: 0;
        }
        .panel,
        .card,
        .stat,
        details {
          background: #fff !important;
          color: #111 !important;
          border-color: #bbb !important;
          break-inside: avoid;
        }
        .muted,
        .dim,
        .tiny,
        .kicker,
        .small {
          color: #444 !important;
        }
        .portrait {
          background: #fff !important;
          border-color: #bbb !important;
        }
        textarea,
        input,
        select {
          border: 0 !important;
          background: #fff !important;
          color: #111 !important;
          padding: 0 !important;
        }
      }

      footer {
        border-top: 1px solid var(--line);
        padding: 26px 20px;
        color: var(--ink3);
        font-size: 11.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
      }

      @media (max-width: 860px) {
        .g4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .g3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 640px) {
        body {
          font-size: 15px;
        }
        header.top {
          padding: 10px 14px calc(10px + env(safe-area-inset-top, 0px));
        }
        .topin {
          gap: 10px;
        }
        .brand span {
          display: none;
        }
        nav.tabs {
          width: 100%;
          margin-left: 0;
          overflow: visible;
          flex-wrap: wrap;
          padding-bottom: 0;
        }
        nav.tabs button {
          white-space: normal;
          padding: 7px 9px;
          font-size: 11px;
          letter-spacing: 0.12em;
        }
        main {
          padding: 22px 14px 70px;
        }
        h1 {
          font-size: 24px;
        }
        .g2,
        .g3,
        .g4 {
          grid-template-columns: 1fr;
        }
        .panel {
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="topin">
        <div class="brand"><b>Kallistis</b><span>Character Forge</span></div>
        <nav class="tabs" id="tabs"></nav>
      </div>
    </header>
    <main id="app"></main>
    <footer>Instrumento determinístico · corpus KALLISTIS · offline</footer>

    <script src="/jogar/kallistis-magic-forms.generated.js"></script>
    <script>
      const CANON = {
        povos: [
          {
            nome: "Aelvari",
            tracos: [
              {
                nome: "Memória Estratificada",
                texto:
                  "Ao investigar um lugar, objeto ou tradição com vínculo histórico, receba +2. Em sucesso forte, você também pode descobrir o que aconteceu, quem tentou ocultá-lo ou qual versão foi descartada.",
              },
            ],
            dom: {
              nome: "Eco Paralelo",
              texto:
                "Uma vez por cena, depois de uma rolagem, substitua um dos seus dados pelo valor natural do outro. Se os dois passarem a mostrar o mesmo valor, ocorre Ressonância. Depois, sofra 1 Pressão no próximo teste de Intelecto ou Vontade.",
            },
            herancas: [
              {
                nome: "Cronista",
                texto:
                  "Conhecimento +1. Você pode registrar uma memória de cena como evidência resistente a alteração comum.",
              },
              {
                nome: "Vidente Cauteloso",
                texto:
                  "Uma vez por cena, pergunte qual consequência imediata parece mais provável caso uma ação continue.",
              },
            ],
            dissonancia: {
              nome: "Sobrecarga Temporal",
              texto:
                "Quando falhar usando memória ancestral, o Mestre pode oferecer confusão entre passado e possibilidade, a perda temporária de uma lembrança atual ou a condição Abalado. ---",
            },
            extras: [],
          },
          {
            nome: "Kragor",
            tracos: [
              {
                nome: "Força de Comunidade",
                texto:
                  "Enquanto estiver adjacente ou na mesma zona que um aliado consciente, receba +1 Fortitude e +1 dano corpo a corpo.",
              },
            ],
            dom: {
              nome: "Juramento Operante",
              texto:
                "Durante uma Pausa Segura, formule um juramento específico com outro personagem que consinta. Enquanto ambos o cumprem, cada um pode conceder +2 ao outro uma vez por cena. Quebrar conscientemente o juramento causa a condição Dissonante até que exista reparação.",
            },
            herancas: [
              {
                nome: "Escudo do Clã",
                texto: "Use sua Reação para receber metade do dano destinado a um aliado próximo.",
              },
              {
                nome: "Voz da Assembleia",
                texto:
                  "Ao liderar uma ação coletiva, dois aliados podem ajudar sem gastar suas ações completas.",
              },
            ],
            dissonancia: {
              nome: "Honra Fechada",
              texto:
                "Quando a proteção da comunidade se transforma em exclusão, aceitar o apagamento da autonomia de alguém “pelo grupo” marca 1 Sombra. ---",
            },
            extras: [],
          },
          {
            nome: "Draken",
            tracos: [
              {
                nome: "Corpo Elemental",
                texto:
                  "Escolha uma Afinidade entre brasa, frio, tormenta, pedra, maré ou vento. Reduza em 2 o dano proveniente dessa Afinidade.",
              },
            ],
            dom: {
              nome: "Manifestação Elemental",
              texto:
                "Gaste 1 Fluxo para acrescentar +3 de dano elemental, alterar o terreno de uma zona, resistir automaticamente a um perigo ambiental de sua Afinidade ou produzir um efeito narrativo equivalente que respeite a escala da cena.",
            },
            herancas: [
              { nome: "Soberania", texto: "Receba +2 contra coerção e medo." },
              {

      function derivados(c) {
        const A = atributos(c),
          t = trilha(c),
          marco = t ? t.marco : 1;
        const vitBase = 10 + (A.Corpo || 0) * 3;
        const vit = Math.floor(vitBase * escala(A.Corpo || 0));
        const prot = protecaoTotal(c);
        const escudo = (c.equipamento.extras || []).includes("Escudo") ? 1 : 0;
        return {
          marco,
          vitalidade: vit,
          lucidez: 8 + (A.Vontade || 0) * 3,
          fluxo: 3 + (A.Sintonia || 0) + Math.ceil(marco / 2),
          guarda: 10 + (A.Agilidade || 0) + prot + escudo,
          fortitude: 10 + (A.Corpo || 0) + (A.Vontade || 0),
          integridade: 10 + (A.Vontade || 0) + (A.Sintonia || 0),
          protecao: prot + escudo,
          carga:
            6 +
            (A.Corpo || 0) +
            (c.povo === "Nomos" &&
            (c.escolhasPovo.modulos || []).includes("Compartimento protegido")
              ? 2
              : 0),
          movimento: "6 células / 2 zonas",
          escalaCorpo: escala(A.Corpo || 0),
        };
      }
      function armadurasPermitidas(c) {
        const t = trilha(c),
          o = t ? byName(CANON.oficios, t.oficio) : null,
          p = ((o && o.proficiencias) || "").toLowerCase();
        const out = ["Roupas reforçadas"];
        if (p.includes("armaduras leves")) out.push("Leve");
        if (p.includes("armaduras médias")) out.push("Média");
        if (p.includes("armaduras pesadas")) out.push("Pesada");
        return [...new Set(out)];
      }
      function escudoPermitido(c) {
        const t = trilha(c),
          o = t ? byName(CANON.oficios, t.oficio) : null;
        return !!(o && /escudos/i.test(o.proficiencias || ""));
      }
      /* distribuição inicial 3,2,2,1,1,0 */
      const POOL_ATTR = [3, 2, 2, 1, 1, 0];
      function attrRestantes(c) {
        const usados = ATTRS.map((a) => c.atributosBase[a]).filter(
          (v) => v !== null && v !== undefined,
        );
        const pool = POOL_ATTR.slice();
        usados.forEach((v) => {
          const i = pool.indexOf(v);
          if (i >= 0) pool.splice(i, 1);
        });
        return pool;
      }
      /* perícias iniciais: 1×3, 3×2, 4×1 */
      const POOL_SKILL = { 3: 1, 2: 3, 1: 4 };
      function skillRestantes(c) {
        const c3 = SKILLS.filter((s) => c.periciasBase[s] === 3).length,
          c2 = SKILLS.filter((s) => c.periciasBase[s] === 2).length,
          c1 = SKILLS.filter((s) => c.periciasBase[s] === 1).length;
        return { 3: POOL_SKILL[3] - c3, 2: POOL_SKILL[2] - c2, 1: POOL_SKILL[1] - c1 };
      }
      function tecnicasDisponiveis(t, marco) {
        const of = byName(CANON.oficios, t.oficio);
        if (!of) return [];
        return of.tecnicas.filter(
          (x) => (NIVEL_MARCO[x.nivel] || 99) <= marco && !t.tecnicas.includes(x.nome),
        );
      }
      function grauMagiaMax(marco, oficio) {
        return oficio === "Tecelão" ? tecelaoMagicGradeMax(marco) : MAGIC_GRADE_CAP(marco);
      }

      /* validação da criação */
      function pendenciasCriacao(c) {
        const p = [],
          t = trilha(c),
          o = t ? byName(CANON.oficios, t.oficio) : null,
          inf = o ? periciasDoOficio(o) : { fixas: [], opcoes: [] };
        if (!c.nome.trim()) p.push("Nome da personagem");
        if (!c.conceito.identidade || !c.conceito.objetivo || !c.conceito.perda)
          p.push("Conceito completo (identidade, objetivo, perda)");
        if (!c.povo) p.push("Povo");
        if (c.povo && !c.heranca) p.push("Herança do Povo");
        (CANON.escolhas_povo[c.povo] || []).forEach((e) => {
          const v = c.escolhasPovo[e.chave],
            n = Array.isArray(v) ? v.length : v ? 1 : 0;
          if (n < e.min) p.push(e.rotulo);
        });
        if (
          c.povo === "Teriantes" &&
          String(c.escolhasPovo.aspecto || "").startsWith("Outro Aspecto") &&
          !c.aspectoOutro.trim()
        )
          p.push("Descrição do outro Aspecto Teriante (aprovação do grupo)");
        if (c.povo === "Livres") {
          const treinadas = t ? [...(t.pericias || []), t.pericaEscolhida].filter(Boolean) : [];
          if (!c.pericaLivre) p.push("Perícia da Aprendizagem Cruzada");
          else if (treinadas.includes(c.pericaLivre))
            p.push("Aprendizagem Cruzada deve escolher Perícia fora do Ofício");
          if (c.heranca === "Múltiplos Caminhos" && !c.tecnicaHeranca)
            p.push("Técnica inicial de outro Ofício (Múltiplos Caminhos)");
        }
        if (!c.origem) p.push("Mundo de criação");
        if (c.origem === "Outro") {
          if (!c.origemBeneficio) p.push("Benefício da origem Outro");
          if (!c.dividaComunitaria.trim()) p.push("Dívida comunitária da origem Outro");
        }
        if (c.origem === "Trocado") {
          if (!c.origemTrocado.nascimento.trim()) p.push("Mundo de nascimento do Trocado");
          if (!c.origemTrocado.criacao.trim()) p.push("Mundo de criação do Trocado");
          if (!c.origemTrocado.descricao.trim())
            p.push("Adaptação ou ressonância involuntária do Trocado");
        }
        if (!t) p.push("Ofício");
        if (t && !t.papel) p.push("Papel de Ressonância");
        if (t && !t.chave) p.push("Chave da Trilha");
        if (t && inf.opcoes.length && !t.pericaEscolhida) p.push("Perícia escolhida do Ofício");
        const ar = attrRestantes(c);
        if (ar.length) p.push("Distribuição de Atributos (" + ar.join(", ") + " restantes)");
        const sr = skillRestantes(c);
        if (sr[3] || sr[2] || sr[1])
          p.push(
            "Distribuição de Perícias (" +
              [sr[3] ? sr[3] + "×3" : "", sr[2] ? sr[2] + "×2" : "", sr[1] ? sr[1] + "×1" : ""]
                .filter(Boolean)
                .join(", ") +
              ")",
          );
        if (!c.equipamento.arma) p.push("Arma, foco ou ferramenta principal");
        if (c.equipamento.arma && !c.equipamento.proficienciaConfirmada)
          p.push("Confirmar que o item principal atende às proficiências do Ofício");
        if (!c.equipamento.armadura) p.push("Armadura permitida ou roupas reforçadas");
        else if (t && !armadurasPermitidas(c).includes(c.equipamento.armadura))
          p.push("Armadura incompatível com as proficiências registradas");
        if ((c.equipamento.extras || []).includes("Escudo") && !escudoPermitido(c))
          p.push("Escudo exige proficiência explícita");
        if (!c.equipamento.ferramenta) p.push("Kit coerente com o Ofício");
        if ((c.equipamento.consumiveis || []).length < 2) p.push("Dois consumíveis diferentes");
        if (
          t &&
          t.oficio === "Tecelão" &&
          (t.knownForms || []).length !== tecelaoMagicTotals(t.marco)
        )
          p.push("Repertório inicial do Tecelão (" + tecelaoMagicTotals(t.marco) + " Formas)");
        if (t && t.oficio === "Evocador") {
          if (t.vinculosEvocados.length < 1) p.push("Ao menos um Vínculo evocado");
          t.vinculosEvocados.forEach((v, i) => {
            if (
              !v.nome ||
              !v.modelo ||
              !v.porte ||
              !v.forma ||
              !v.aparencia ||
              !v.ancora ||
              !v.impulso ||
              !v.pacto ||
              !v.consciencia
            )
              p.push(
                "Vínculo evocado " +
                  (i + 1) +
                  " incompleto (nome, porte, modelo, forma, aparência, Âncora, Impulso, Pacto e consciência)",
              );
          });
        }
        if (c.vinculos.filter((v) => v.trim()).length < 3) p.push("Três Vínculos");
        if (!c.promessa) p.push("Promessa");
        if (!c.ferida) p.push("Ferida");
        if (!c.pergunta) p.push("Pergunta pessoal");
        return p;
      }

      /* ganhos por Marco */
      function ganhosMarco(marco, t) {
        const of = byName(CANON.oficios, t.oficio);
        const lista = [];
        switch (marco) {

          case 12:

              {
                id: "m12-manifestacao",

              },
            );
            break;
          case 13:
            lista.push(
              { id: "m13", tipo: "atributo", rotulo: "+1 Atributo (máximo 8)" },
              {
                id: "m13-manifestacao",
                tipo: "manifestacao_epica",
                rotulo: "Manifestação Épica III",
              },
              { id: "m13-magia-epica", tipo: "magia_epica", tier: "II", rotulo: "Magia Épica II" },
            );
            break;
          case 14:
            lista.push(
              { id: "m14", tipo: "atributo", rotulo: "+1 Atributo (máximo 9)" },
              {
                id: "m14-manifestacao",
                tipo: "manifestacao_epica",
                rotulo: "Manifestação Épica IV",
              },
            );
            break;
          case 15:
            lista.push(
              { id: "m15", tipo: "atributo", rotulo: "+1 Atributo (máximo 10)" },
              {
                id: "m15-manifestacao",
                tipo: "manifestacao_epica",
                rotulo: "Manifestação Épica V",
              },
              {
                id: "m15-magia-epica",
                tipo: "magia_epica",
                tier: "III",
                rotulo: "Magia Épica III",
              },
            );
            break;
        }
        return lista;
      }
      function atributoMaximoMarco(marco) {
        return marco >= 11 ? marco - 5 : marco >= 7 ? 5 : marco >= 5 ? 4 : 3;
      }
      function ganhosPendentes(t) {
        const out = [];
        for (let m = 2; m <= t.marco; m++) {
          ganhosMarco(m, t).forEach((g) => {
            if (!t.ganhos[g.id]) out.push({ marco: m, ...g });
          });
        }
        if (t.oficio === "Tecelão")
          Array.from({ length: tecelaoMagicDeficit(t) }, (_, i) =>
            out.push({
              marco: t.marco,
              id: "tecelao-forma-" + i,
              tipo: "forma_tecelao",
              rotulo: "+1 Forma canônica",
            }),
          );
        return out;
      }

      function characterListStatus(p) {

      function exportar(p, incluirImagens = true) {
        const c = JSON.parse(JSON.stringify(p));
        if (!incluirImagens) {
          c.retrato = null;
          c.galeria = [];
        }
        const payload = {
          schema: EXPORT_SCHEMA,
          ruleset: RULESET,
          exportadoEm: new Date().toISOString(),
          character: c,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const a = el("a", {
          href: URL.createObjectURL(blob),
          download: (p.nome || "personagem").replace(/\s+/g, "_") + ".kallistis.json",
        });
        document.body.appendChild(a);
        a.click();
        URL.revokeObjectURL(a.href);
        a.remove();
      }
      function validarImportacao(c) {
        const erros = [];
        const obj = (v) => v && typeof v === "object" && !Array.isArray(v);
        const campoTexto = (v, n) => {
          if (v !== undefined && typeof v !== "string") erros.push(n + " deve ser texto");
        };
        const campoNumero = (v, n, min, max) => {
          if (
            v !== undefined &&
            (!Number.isFinite(v) || !Number.isInteger(v) || v < min || v > max)
          )
            erros.push(n + " deve ser número inteiro entre " + min + " e " + max);
        };
        if (!obj(c)) return ["objeto de personagem ausente"];
        if (!obj(c.atributosBase)) erros.push("atributosBase deve ser um objeto");
        if (c.atributosBase)
          Object.entries(c.atributosBase).forEach(([n, v]) => {
            if (!ATTRS.includes(n)) erros.push("atributo desconhecido: " + n);
            else campoNumero(v, "atributosBase." + n, 0, 4);
          });
        if (obj(c.periciasBase))
          Object.entries(c.periciasBase).forEach(([n, v]) => {
            if (!SKILLS.includes(n)) erros.push("perícia desconhecida: " + n);
            else campoNumero(v, "periciasBase." + n, 0, 4);
          });
        else if (c.periciasBase !== undefined) erros.push("periciasBase deve ser um objeto");
        campoTexto(c.nome, "nome");
        campoTexto(c.povo, "povo");
        campoTexto(c.heranca, "heranca");
        campoTexto(c.origem, "origem");
        campoTexto(c.manifestacao_pessoal, "manifestacao_pessoal");
        campoNumero(c.fulgor, "fulgor", 0, 5);
        if (
          c.capacidade_manifestacoes !== undefined &&
          (!obj(c.capacidade_manifestacoes) ||
            Object.keys(c.capacidade_manifestacoes).some(
              (k) =>
                !/^(ability|technique|magic):[A-Za-z0-9._-]+$/.test(k) ||
                typeof c.capacidade_manifestacoes[k] !== "string" ||
                c.capacidade_manifestacoes[k].length > 10000,
            ))
        )
          erros.push("capacidade_manifestacoes inválida");
        if (c.povo && !byName(CANON.povos, c.povo)) erros.push("Povo desconhecido: " + c.povo);
        if (c.povo && c.heranca) {
          const povo = byName(CANON.povos, c.povo);
          if (povo && !povo.herancas.some((h) => h.nome === c.heranca))
            erros.push("Herança incompatível com o Povo");
        }
        if (c.origem && !byName(CANON.origens, c.origem))
          erros.push("Origem desconhecida: " + c.origem);
        if (c.trilhas !== undefined && !Array.isArray(c.trilhas))
          erros.push("trilhas deve ser uma lista");
        if (Array.isArray(c.trilhas))
          c.trilhas.forEach((t, i) => {
            if (!obj(t)) {
              erros.push("trilha " + i + " inválida");
              return;
            }
            campoTexto(t.oficio, "trilhas." + i + ".oficio");
            campoTexto(t.papel, "trilhas." + i + ".papel");
            campoTexto(t.chave, "trilhas." + i + ".chave");
            campoNumero(t.marco, "trilhas." + i + ".marco", 1, 15);
            if (t.oficio) {
              const o = byName(CANON.oficios, t.oficio);
              if (!o) erros.push("Ofício desconhecido: " + t.oficio);
              else {
                if (t.papel && !o.papeis.includes(t.papel))
                  erros.push("Papel incompatível com o Ofício");
                if (t.chave && !o.chaves.includes(t.chave))
                  erros.push("Chave incompatível com o Ofício");
                const nomes = [
                  o.tecnica_inicial && o.tecnica_inicial.nome,
                  ...(o.tecnicas || []).map((x) => x.nome),
                  ...(CANON.tecnicas_universais || []).map((x) => x.nome),
                ];
                if (Array.isArray(t.tecnicas))
                  t.tecnicas.forEach((n) => {
                    if (typeof n !== "string" || !nomes.includes(n))
                      erros.push("Técnica desconhecida: " + n);
                  });
              }
            }
          });
        if (c.trilhaAtiva !== undefined)
          campoNumero(c.trilhaAtiva, "trilhaAtiva", 0, Math.max(0, (c.trilhas || []).length - 1));
        return erros;

      function importar(ev) {
        const f = ev.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const raw = JSON.parse(r.result);
            let d = raw;
            if (raw && raw.schema) {
              if (!raw.character) throw new Error("Pacote sem personagem");
              d = raw.character;
            }
            if (!d || !d.atributosBase) throw new Error("Formato não reconhecido");
            const erros = validarImportacao(d);
            if (erros.length) throw new Error(erros.join("; "));
            if (
              raw &&
              raw.schema &&
              raw.ruleset &&
              raw.ruleset !== RULESET &&
              !confirm(
                "Este arquivo declara ruleset diferente (" +
                  raw.ruleset +
                  "). Importar mesmo assim?",
              )
            )
              return;
            d = normalizarPersonagem(d);
            d.id = uid();
            registrarHistorico(d, "importação", "Personagem importada para " + RULESET);
            DB.personagens.push(d);
            DB.atual = d.id;
            save();
            VIEW = d.completo ? "dossie" : "criar";
            render();
          } catch (e) {
            alert("Arquivo inválido: " + e.message);
          }
        };
        r.readAsText(f);
        ev.target.value = "";
      }

      function processarImagemArquivo(file, callback) {
        if (!file || !/^image\//.test(file.type || "")) {
          alert("Selecione um arquivo de imagem.");
          return;
        }
        const r = new FileReader();
        r.onload = () => {
          const img = new Image();
          img.onload = () => {
            const max = 1400,
              scale = Math.min(1, max / Math.max(img.width, img.height)),
              w = Math.max(1, Math.round(img.width * scale)),
              h = Math.max(1, Math.round(img.height * scale));
            const cv = document.createElement("canvas");
            cv.width = w;
            cv.height = h;
            const ctx = cv.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            let data;
            try {
              data = cv.toDataURL("image/webp", 0.82);
            } catch (e) {
              data = cv.toDataURL("image/jpeg", 0.82);
            }
            callback({ data, nome: file.name || "imagem", adicionadaEm: new Date().toISOString() });
          };
          img.onerror = () => alert("Não foi possível ler a imagem.");
          img.src = r.result;
        };
        r.readAsDataURL(file);
      }
      function descricaoOrigem(c, or) {
        let extra = "";
        if (c.origem === "Outro")

        if (c.origem === "Trocado")

            c.origemTrocado.criacao ? "Criação: " + c.origemTrocado.criacao : "",
            c.origemTrocado.descricao,
          ]
            .filter(Boolean)
            .join(" · ");
        return or.texto + (extra ? " · " + extra : "");
      }

        const canAssign = bridge && bridge.canAssignMesas === true;
        const assigned = c._serverMesas || [];
        const options = bridge && Array.isArray(bridge.mesas) ? bridge.mesas : [];
        const selected = new Set(Array.isArray(c.mesaIds) ? c.mesaIds : []);
        if (!canAssign)
          p.appendChild(
            el(
              "p",
              { class: "small dim" },
              assigned.length
                ? "Mesas atribuídas: " + assigned.map((m) => m.name).join(", ")

            ),
          );
        else if (!c._serverId)
          p.appendChild(
            el(
              "p",
              { class: "small dim" },
              "Salve a personagem no servidor para o Mestre definir suas Mesas.",
            ),
          );
        else if (!options.length)
          p.appendChild(
            el("p", { class: "small dim" }, "Nenhuma Mesa ativa disponível para este jogador."),
          );
        else {
          const list = el("div", { class: "grid g2" });
          options.forEach((mesa) => {
            const input = el("input", {
              type: "checkbox",
              checked: selected.has(mesa.id),
              disabled: !c._serverId,
            });
            input.addEventListener("change", async () => {
              if (input.checked) selected.add(mesa.id);
              else selected.delete(mesa.id);
              c.mesaIds = [...selected];
              c._mesaSelectionDirty = true;
              try {
                await bridge.setMesas(c, c.mesaIds);
              } catch (e) {
                input.checked = !input.checked;
                selected.clear();
                c.mesaIds = (c._serverMesaIds || []).slice();
                c.mesaIds.forEach((id) => selected.add(id));
              }
            });
            list.appendChild(
              el(
                "label",
                { class: "card", style: "display:flex;align-items:center;gap:10px;cursor:pointer" },
                input,
                el("span", null, mesa.name),
              ),
            );
          });
          p.appendChild(list);
        }
        return p;
      }

            companionsView.appendChild(
              el(
                "div",
                { class: "card", style: "margin-top:10px" },
                el("h4", null, title + " · " + (item.nome || "sem nome")),
                el(
                  "p",
                  { class: "small muted", style: "white-space:pre-wrap" },
                  item.descricao || "—",

        /* reservas */

                el(

                  "button",
                  {
                    disabled: protectedStatus,
                    style: "width:auto;padding:0 10px;font-size:11px;letter-spacing:.14em",
                    title: "Restaurar valor inicial",

                      render();

        res.appendChild(rg);
        const sombra = c.reservas.sombra || 0;
        const est = CANON.sombra_escala.find((s) => {
          const n = s.nome;
          if (n.includes("-")) {
            const [a, b] = n.split("-").map(Number);
            return sombra >= a && sombra <= b;
          }
          return Number(n) === sombra;
        });
        if (est)
          res.appendChild(
            el(
              "p",
              { class: "small " + (sombra >= 5 ? "" : "muted"), style: "margin-top:10px" },
              "Sombra " +

                " — " +
                est.estado +

        wrap.appendChild(res);

        /* defesas e atributos */
        const stats = el("div", { class: "panel" });
        stats.appendChild(el("div", { class: "kicker" }, "Valores derivados"));
        stats.appendChild(
          el(
            "div",
            { class: "grid g4" },
            stat(d.guarda, "Guarda"),
            stat(d.fortitude, "Fortitude"),
            stat(d.integridade, "Integridade"),
            stat(d.protecao, "Proteção"),
            stat(d.carga, "Carga"),
            stat(d.movimento, "Movimento"),
            stat("×" + d.escalaCorpo, "Escala de Corpo"),
            stat(d.marco, "Marco"),

        stats.appendChild(el("div", { class: "sep" }));
        const ag = el("div", { class: "grid g3" });
        ATTRS.forEach((a) =>
          ag.appendChild(el("div", { class: "stat" }, el("b", null, A[a]), el("span", null, a))),
        );
        stats.appendChild(ag);
        wrap.appendChild(stats);

        /* perícias */
        const per = el("div", { class: "panel" });
        per.appendChild(el("div", { class: "kicker" }, "Perícias"));
        const pg = el("div", { class: "grid g3" });
        SKILLS.forEach((s) =>
          pg.appendChild(
            el(
              "div",
              {
                class: "row",
                style:
                  "justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0",
              },
              el("span", { class: "small" + (P[s] ? "" : " dim") }, s),
              el("b", { style: "font-family:var(--serif)" }, P[s]),
            ),
          ),

        per.appendChild(pg);
        wrap.appendChild(per);

        /* núcleo permanente */
        const pv = byName(CANON.povos, c.povo);
        if (pv) {
          const n = el("div", { class: "panel" });
          n.appendChild(el("div", { class: "kicker" }, "Núcleo permanente · Povo"));
          pv.tracos.forEach((x) => {
            n.appendChild(bloco("Traço — " + x.nome, x.texto));
            n.appendChild(
              capacidadeEditor(
                c,
                "ability",
                slugCapacidade(x.nome),
                x.nome,
                x.texto,
                protectedStatus,
              ),
            );
          });
          if (pv.dom) {
            n.appendChild(bloco("Dom — " + pv.dom.nome, pv.dom.texto));
            n.appendChild(
              capacidadeEditor(
                c,
                "ability",
                slugCapacidade(pv.dom.nome),
                pv.dom.nome,
                pv.dom.texto,
                protectedStatus,
              ),
            );
          }
          const her = byName(pv.herancas, c.heranca);
          if (her) {
            n.appendChild(bloco("Herança — " + her.nome, her.texto));
            n.appendChild(
              capacidadeEditor(
                c,
                "ability",
                slugCapacidade(her.nome),
                her.nome,
                her.texto,
                protectedStatus,
              ),
            );
          }
          if (pv.dissonancia) {
            n.appendChild(bloco("Dissonância — " + pv.dissonancia.nome, pv.dissonancia.texto));
            n.appendChild(
              capacidadeEditor(
                c,
                "ability",
                slugCapacidade(pv.dissonancia.nome),
                pv.dissonancia.nome,
                pv.dissonancia.texto,
                protectedStatus,
              ),
            );
          }
          (CANON.escolhas_povo[c.povo] || []).forEach((e) => {
            const v = c.escolhasPovo[e.chave];
            if (!v) return;
            n.appendChild(
              el(
                "p",
                { class: "small muted" },
                e.rotulo + ": " + (Array.isArray(v) ? v.join(", ") : v),
              ),
            );
          });
          if (c.povo === "Livres" && c.pericaLivre)
            n.appendChild(
              el("p", { class: "small muted" }, "Aprendizagem Cruzada: " + c.pericaLivre + " +1"),
            );
          if (c.tecnicaHeranca) {
            n.appendChild(
              bloco(
                "Múltiplos Caminhos — " + c.tecnicaHeranca.nome,
                "Técnica inicial aprendida de " +
                  c.tecnicaHeranca.oficio +
                  ". Não cria nova Trilha.",
              ),
            );
            n.appendChild(
              capacidadeEditor(
                c,
                "technique",
                "heritage." +
                  slugCapacidade(c.tecnicaHeranca.oficio || "universal") +
                  "." +
                  slugCapacidade(c.tecnicaHeranca.nome),
                c.tecnicaHeranca.nome,
                c.tecnicaHeranca.texto || "Técnica canônica aprendida por escolha explícita.",
                protectedStatus,
              ),
            );
          }
          if (c.povo === "Teriantes" && c.aspectoOutro)
            n.appendChild(
              el(
                "p",
                { class: "small muted" },
                "Aspecto personalizado: " + c.aspectoOutro + " · aprovação do grupo",
              ),
            );
          const or = byName(CANON.origens, c.origem);
          if (or) n.appendChild(bloco("Mundo de criação — " + or.nome, descricaoOrigem(c, or)));
          wrap.appendChild(n);
        }

        /* trilha */
        if (t) {
          const of = byName(CANON.oficios, t.oficio);
          const tr = el("div", { class: "panel" });
          if (!of) {
            tr.appendChild(el("div", { class: "kicker" }, "Trilha ativa · Marco " + t.marco));
            tr.appendChild(el("p", { class: "small muted" }, "Ofício ainda não definido"));
          } else {
            tr.appendChild(
              el("div", { class: "kicker" }, "Trilha ativa · " + of.nome + " · Marco " + t.marco),
            );
            tr.appendChild(
              el(
                "p",
                { class: "small muted" },
                "Papel: " +
                  t.papel +
                  " · Chave: " +
                  (t.chaveNome ? t.chaveNome + " (" + t.chave + ")" : t.chave),
              ),
            );
            tr.appendChild(el("p", { class: "small dim" }, "Proficiências: " + of.proficiencias));
            if (of.notas && of.notas.length)
              of.notas.forEach((n) =>
                tr.appendChild(el("div", { class: "note", style: "margin-top:8px" }, n)),
              );
            tr.appendChild(el("div", { class: "sep" }));
            tr.appendChild(el("div", { class: "kicker" }, "Técnicas"));
            t.tecnicas.forEach((nome) => {
              const tec =
                byName(of.tecnicas, nome) ||
                (of.tecnica_inicial && of.tecnica_inicial.nome === nome
                  ? { nome, nivel: "Inicial", custo: "—", efeito: of.tecnica_inicial.texto }
                  : null) ||
                tecnicaExterna(nome);
              if (!tec) return;
              const techniqueId = slugCapacidade(of.nome) + "." + slugCapacidade(tec.nome);
              tr.appendChild(
                el(
                  "details",
                  null,
                  el("summary", null, tec.nome + " · " + (tec.nivel || "Inicial")),
                  el(
                    "div",
                    { class: "body" },
                    el("p", {
                      html:
                        (tec.custo && tec.custo !== "—"
                          ? "<b>" + esc(tec.custo) + "</b><br>"
                          : "") + md(tec.efeito || ""),
                    }),
                    capacidadeEditor(
                      c,
                      "technique",
                      techniqueId,
                      tec.nome,
                      tec.efeito || "",
                      protectedStatus,
                    ),
                  ),
                ),
              );
            });
            if (t.especializacoes.length) {
              tr.appendChild(el("div", { class: "sep" }));
              tr.appendChild(el("div", { class: "kicker" }, "Especializações"));
              t.especializacoes.forEach((nm) => {
                const e = byName(of.especializacoes, nm);
                if (e)
                  tr.appendChild(
                    el(
                      "details",
                      null,
                      el("summary", null, e.nome),
                      el("div", { class: "body", html: md(e.texto) }),
                    ),
                  );
              });
            }
            if ((t.knownForms || []).length) {
              tr.appendChild(el("div", { class: "sep" }));
              tr.appendChild(
                el(
                  "div",
                  { class: "kicker" },
                  "Formas conhecidas · " +
                    (t.knownForms || []).length +
                    " · teto G" +
                    MAGIC_GRADE_CAP(t.marco),
                ),
              );
              (t.knownForms || []).forEach((known) => {
                const m = FORM_BY_ID(known.formId);
                if (!m) return;
                tr.appendChild(
                  el(
                    "details",
                    null,
                    el("summary", null, m.canonicalName + " · máximo G" + known.maxGrade),
                    el(
                      "div",
                      { class: "body" },
                      capacidadeEditor(
                        c,
                        "magic",
                        m.id,
                        m.canonicalName,
                        m.summary ||
                          m.g0 ||
                          "Forma canônica persistida por ID; grau máximo " + known.maxGrade + ".",
                        protectedStatus,
                      ),
                    ),
                  ),
                );
              });
            }
            if (t.magiaEpica || t.manifestacoesEpicas.length) {
              tr.appendChild(el("div", { class: "sep" }));
              tr.appendChild(el("div", { class: "kicker" }, "Camada Épica"));
              if (t.magiaEpica)
                tr.appendChild(
                  el(
                    "p",
                    { class: "small muted" },
                    "Magia Épica " +
                      t.magiaEpica +
                      " · separada dos Graus 0–3; não adiciona recurso nem ação.",
                  ),
                );
              t.manifestacoesEpicas.forEach((m) =>
                tr.appendChild(
                  el(
                    "details",
                    null,
                    el(
                      "summary",
                      null,
                      (m.nome || "Manifestação Épica") +
                        " · Marco " +
                        (m.marco || "—") +
                        (m.statusHomologacao
                          ? " · " + m.statusHomologacao
                          : m.aprovadaPeloMestre
                            ? " · aprovada"
                            : " · aguardando Mestre"),
                    ),
                    el(
                      "div",
                      { class: "body" },
                      el(
                        "p",
                        null,
                        "Horizonte: " + (m.horizonte || "—") + " · Tipo: " + (m.tipo || "normal"),
                      ),
                      el("p", null, m.descricao || "—"),
                      el("p", null, "Efeito: " + (m.efeito || "—")),
                      el(
                        "p",
                        null,
                        "Custo: " + (m.custo || "—") + " · Limitações: " + (m.limitacoes || "—"),
                      ),
                      m.masterFeedback
                        ? el("p", { class: "muted" }, "Feedback do Mestre: " + m.masterFeedback)
                        : null,
                    ),
                  ),
                ),
              );
            }
            if (t.vinculosEvocados.length) {
              tr.appendChild(el("div", { class: "sep" }));
              tr.appendChild(el("div", { class: "kicker" }, "Vínculos evocados"));
              t.vinculosEvocados.forEach((v) =>
                tr.appendChild(
                  el(
                    "div",
                    { class: "card", style: "margin-bottom:8px" },
                    el(
                      "h4",
                      null,
                      (v.nome || v.modelo || v.forma || "Vínculo") +
                        " · Porte " +
                        (v.porte || "Menor"),
                    ),
                    el("p", null, "Modelo: " + (v.modelo || "—") + " · Forma: " + (v.forma || "—")),
                    el("p", null, "Âncora: " + (v.ancora || "—")),
                    el("p", null, "Impulso: " + (v.impulso || "—")),
                    el("p", null, "Pacto: " + (v.pacto || "—")),
                    el("p", null, "Consciência: " + (v.consciencia || "—")),
                    el(
                      "p",
                      { class: "muted small" },
                      "Estatísticas e capacidades derivadas do modelo de catálogo.",
                    ),
                  ),
                ),
              );
            }
            if (t.legado) tr.appendChild(bloco("Legado", t.legado));
          }
          wrap.appendChild(tr);
        }

        /* equipamento */
        const eq = el("div", { class: "panel" });
        eq.appendChild(el("div", { class: "kicker" }, "Equipamento"));
        const arma = byName(CANON.armas, c.equipamento.arma);
        const tb = el("table");
        const tbb = el("tbody");
        if (arma)
          tbb.appendChild(
            el(
              "tr",
              null,
              el("td", null, "Arma / foco"),
              el("td", null, arma.nome),
              el("td", null, "Dano-base " + arma.dano + " · " + arma.alcance + " · " + arma.tags),
            ),
          );
        const arm = byName(CANON.armaduras, c.equipamento.armadura);
        if (arm)
          tbb.appendChild(
            el(
              "tr",
              null,
              el("td", null, "Armadura"),
              el("td", null, arm.nome),
              el("td", null, "Proteção " + arm.protecao + " · " + arm.mod),
            ),
          );
        if ((c.equipamento.extras || []).includes("Escudo"))
          tbb.appendChild(
            el(
              "tr",
              null,
              el("td", null, "Escudo"),
              el("td", null, "Escudo"),
              el("td", null, "+1 Guarda; usa uma mão e pode servir como Chave"),
            ),
          );
        const fer = byName(CANON.ferramentas, c.equipamento.ferramenta);
        if (fer)
          tbb.appendChild(
            el(
              "tr",
              null,
              el("td", null, "Kit"),
              el("td", null, fer.nome),
              el("td", null, fer.uso),
            ),
          );
        (c.equipamento.consumiveis || []).forEach((nm) => {
          const k = byName(CANON.consumiveis, nm);
          if (k)
            tbb.appendChild(
              el(
                "tr",
                null,
                el("td", null, "Consumível"),
                el("td", null, k.nome),
                el("td", null, k.efeito),
              ),
            );
        });
        tb.appendChild(tbb);
        eq.appendChild(tb);
        if (arma) {
          const tags = arma.tags
            .split(",")
            .map((s) => s.trim())
            .map((s) => s.charAt(0).toUpperCase() + s.slice(1));
          const regras = CANON.tags_arma.filter((t2) => tags.includes(t2.nome));
          if (regras.length) {
            eq.appendChild(el("div", { class: "sep" }));
            regras.forEach((r) =>
              eq.appendChild(
                el("p", { class: "small muted" }, el("b", null, r.nome + ". "), r.regra),
              ),
            );
          }
        }
        wrap.appendChild(eq);

        /* condições */
        const cond = el("div", { class: "panel" });
        cond.appendChild(el("div", { class: "kicker" }, "Condições ativas"));
        const cr = el("div", { class: "row" });
        CANON.condicoes.forEach((k) => {
          const on = (c.condicoes || []).includes(k.nome);
          cr.appendChild(
            el(
              "button",
              {
                disabled: protectedStatus,
                class: "chip " + (on ? "on" : ""),
                style: "cursor:pointer",
                title: k.efeito,
                onclick: () => {
                  c.condicoes = on
                    ? c.condicoes.filter((x) => x !== k.nome)
                    : [...(c.condicoes || []), k.nome];
                  save();
                  render();
                },
              },
              k.nome,
            ),
          );
        });
        cond.appendChild(cr);
        (c.condicoes || []).forEach((nm) => {
          const k = byName(CANON.condicoes, nm);
          if (k)
            cond.appendChild(
              el(
                "p",
                { class: "small muted", style: "margin-top:8px" },
                el("b", null, k.nome + ". "),
                k.efeito + " · Duração: " + k.duracao + " · Remoção: " + k.remocao,
              ),
            );
        });
        wrap.appendChild(cond);

        /* laços */
        wrap.appendChild(fichaResumo(c));

        const notas = el("div", { class: "panel" });
        notas.appendChild(el("div", { class: "kicker" }, "Anotações da mesa"));
        notas.appendChild(
          el(
            "textarea",
            {
              readOnly: protectedStatus,
              style: "min-height:140px",
              oninput: (e) => {
                c.anotacoes = e.target.value;
                marcaSalva();
              },
            },
            c.anotacoes || "",
          ),
        );
        notas.appendChild(
          el(
            "div",
            { class: "row", style: "margin-top:12px" },
            el(
              "button",
              { class: "btn", onclick: () => exportar(c, true) },
              "Exportar com imagens",
            ),
            el(
              "button",
              { class: "btn ghost", onclick: () => exportar(c, false) },
              "Exportar sem imagens",
            ),
            el("button", { class: "btn ghost", onclick: () => window.print() }, "Imprimir ficha"),
            el(
              "button",
              {
                class: "btn ghost",
                onclick: () => {
                  VIEW = "progressao";
                  render();
                },
              },
              "Abrir progressão",
            ),
            protectedStatus
              ? null
              : el(
                  "button",
                  {
                    class: "btn ghost",
                    onclick: () => {
                      if (
                        confirm(
                          "Reabrir a criação permite alterar escolhas mecânicas iniciais. Continuar?",
                        )
                      ) {
                        criarCheckpoint(c, "Antes de reabrir criação");
                        registrarHistorico(c, "estrutura", "Criação reaberta");
                        c.passo = 0;
                        c.completo = false;
                        save();
                        VIEW = "criar";
                        render();
                      }
                    },
                  },
                  "Reabrir criação",
                ),
          ),
        );
        wrap.appendChild(notas);
        wrap.appendChild(painelHistorico(c));
        return wrap;
      }
      function tecnicaExterna(nome) {
        for (const of of CANON.oficios) {
          const t = byName(of.tecnicas, nome);
          if (t) return { ...t, nome: t.nome + " (" + of.nome + ")" };
        }
        return null;
      }
      function bloco(titulo, texto) {
        return el(
          "div",
          { class: "card", style: "margin-top:10px" },
          el("h4", null, titulo),
          el("p", { html: md(texto) }),
        );
      }
      function fichaResumo(c) {
        const p = el("div", { class: "panel" });
        p.appendChild(el("div", { class: "kicker" }, "Laços e questões"));
        const l = el("div", { class: "grid g2" });
        l.appendChild(
          el(
            "div",
            { class: "card" },
            el("h4", null, "Vínculos"),
            el("p", { html: c.vinculos.filter(Boolean).map(esc).join("<br>") || "—" }),
          ),
        );
        l.appendChild(
          el(
            "div",
            { class: "card" },
            el("h4", null, "Promessa"),
            el("p", null, c.promessa || "—"),
          ),
        );
        l.appendChild(

      /* ---------- progressão ---------- */

          ),

        const pend = ganhosPendentes(t),

                  t.advanceAuthorizedFor = null;
                  t.advanceNote = "";
                  registrarHistorico(
                    c,
                    "Marco " + t.marco,
                    "Avanço autorizado pelo Mestre" + (nota ? " — " + nota : ""),

                  render();
                },

              ? el(
                  "button",

        else if (pend.length)

        else if (t.marco < 15 && autorizado)

              { class: "okbox", style: "margin-top:12px" },

        else if (t.marco < 15)
          head.appendChild(
            el(
              "div",
              { class: "note", style: "margin-top:12px" },
              "O próximo Marco só aparece como disponível depois que o Mestre o habilita no Modo Mestre.",
            ),
          );
        wrap.appendChild(head);

        if (pend.length) {
          const pp = el("div", { class: "panel" });
          pp.appendChild(el("div", { class: "kicker" }, "Ganhos a resolver"));
          pend.forEach((g) => pp.appendChild(resolvedorGanho(c, t, g)));
          wrap.appendChild(pp);
        }

        const tab = el("div", { class: "panel" });
        tab.appendChild(el("div", { class: "kicker" }, "Tabela de Marcos"));
        const tb = el("table"),
          tbb = el("tbody");
        tb.appendChild(

            el(

        CANON.progressao.forEach((m) => {

          tbb.appendChild(

              el(
                "td",
                { class: "small muted" },
                m.marco === 1
                  ? feito

                  : regs.join(" · ") || (feito ? "pendente" : "—"),
              ),
            ),
          );
        });
        tb.appendChild(tbb);
        tab.appendChild(tb);
        wrap.appendChild(tab);

        const lk = el("div", { class: "panel" });
        lk.appendChild(el("div", { class: "kicker" }, "Limites aplicados"));
        [
          [
            "Uma Trilha ativa",
            "Apenas a Trilha ativa produz benefícios mecânicos. Memória permanece; progressão ativa muda.",
          ],
          ["Marco 5", "Aumento de Atributo até o máximo 4 na progressão ordinária."],
          [
            "Marco 6",
            "Técnicas de Nível III já podem ser adquiridas; Técnica avançada pode ser Nível III.",
          ],
          [
            "Marco 9",
            "Segunda Especialização do mesmo Ofício ou Técnica de outro Ofício, registrada como exceção da Trilha ativa.",
          ],
          [
            "Marcos 11–15",
            "Cada Marco concede exatamente +1 Atributo e eleva o teto para 6, 7, 8, 9 e 10. A personagem também propõe uma Manifestação Épica, que precisa de aprovação do Mestre.",
          ],
          [
            "Magia Épica",
            "I em M11, II em M13 e III em M15. É separada dos Graus 0–3: não cria Grau 4, 5 ou 6, recurso ou ação extra.",
          ],
          [
            "Novo Ofício",
            "Nasce no Marco 1, exige causa narrativa reconhecida e Chave própria. Não recebe Marcos retroativos.",
          ],
          [
            "Progressão mágica do Tecelão",
            "Grau 0 e 1 desde o Marco 1; Grau 2 desde o Marco 3; Grau 3 desde o Marco 5; o repertório cresce conforme a tabela acima.",
          ],
          ["Evocação Maior", "Acesso normal pela Técnica de Evocador no Marco 6."],
        ].forEach(([a, b]) =>
          lk.appendChild(el("p", { class: "small muted" }, el("b", null, a + ". "), b)),
        );
        wrap.appendChild(lk);

        const tt = el("div", { class: "panel" });
        tt.appendChild(el("div", { class: "kicker" }, "Trilhas da personagem"));
        c.trilhas.forEach((tr, i) => {

          const card = el("div", { class: "card", style: "margin-bottom:8px" });

              "div",

              el(
                "div",

              i !== c.trilhaAtiva
                ? el(
                    "button",
                    {
                      class: "btn",
                      disabled: !DB.mestre,
                      onclick: () => {

                        criarCheckpoint(c, "Antes da troca de Trilha");

                        render();

          if (!tr.papel || !tr.chave || (inf.opcoes.length && !tr.pericaEscolhida)) {
            card.appendChild(el("div", { class: "sep" }));
            card.appendChild(el("div", { class: "tiny" }, "Configuração pendente desta Trilha"));
            if (!tr.papel) {
              const rr = el("div", { class: "row", style: "margin-top:8px" });
              o.papeis.forEach((x) =>
                rr.appendChild(
                  el(
                    "button",
                    {
                      class: "chip",
                      style: "cursor:pointer",
                      onclick: () => {
                        tr.papel = x;
                        save();
                        render();
                      },
                    },
                    x,
                  ),
                ),
              );
              card.appendChild(rr);
            }
            if (inf.opcoes.length && !tr.pericaEscolhida) {
